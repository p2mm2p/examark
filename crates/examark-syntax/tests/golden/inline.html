<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>行内元素</title>
    <style>
      body { margin: 0 auto; max-width: 40rem; padding: 2rem 1rem; font-family: system-ui, sans-serif; line-height: 1.8; color: #222; }
      h1 { font-size: 1.4rem; }
      h2 { font-size: 1.15rem; margin-top: 2.5rem; }
      h3 { font-size: 1rem; color: #666; }
      .paper-meta { color: #666; font-size: .9rem; }
      .question { margin: 1.5rem 0; }
      .options { list-style: none; padding: 0; }
      .options li { margin: .25rem 0; }
      .answer { font-weight: 600; }
      .explanation { color: #444; }
      .material { margin: 1.5rem 0 0; }
      .blank { display: inline-block; width: 4em; height: 1em; border-bottom: 1px solid currentColor; }
    </style>
  </head>
  <body>
    <article class="paper">
      <header class="paper-header">
        <h1>行内元素</h1>
      </header>
      <section class="module">
        <h2>数量关系</h2>
        <article class="question">
          <p class="stem"><span class="question-number">1.</span> 当 <span class="math">x&gt;0</span> 时，<img src="assets/图1.png" alt=""> 恒成立；在 <span class="blank"></span> 处填入合适的表达式。</p>
          <ul class="options">
            <li><span class="option-letter">A.</span> <span class="math">\frac{1}{2}</span></li>
            <li><span class="option-letter">B.</span> 乙 &lt; 丙 &amp; 丁</li>
            <li><span class="option-letter">C.</span> <img src="assets/选项丙.png" alt=""></li>
            <li><span class="option-letter">D.</span> 丁</li>
          </ul>
          <p class="answer">答案：A</p>
          <div class="explanation">
            <p><span class="label">解析：</span>由 <span class="math">x&gt;0</span> 可知，选 A。</p>
          </div>
        </article>
      </section>
    </article>
  </body>
</html>
