<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>材料题</title>
    <style>
      body { margin: 0 auto; max-width: 40rem; padding: 2rem 1rem; font-family: system-ui, sans-serif; line-height: 1.8; color: #222; }
      h1 { font-size: 1.4rem; }
      h2 { font-size: 1.15rem; margin-top: 2.5rem; }
      h3 { font-size: 1rem; color: #666; }
      .paper-meta { color: #666; font-size: .9rem; }
      .question { margin: 1.5rem 0; }
      .options { list-style: none; padding: 0; }
      .options li { margin: .25rem 0; }
      .answer { font-weight: 600; }
      .explanation { color: #444; }
      .material { margin: 1.5rem 0 0; }
      .blank { display: inline-block; width: 4em; height: 1em; border-bottom: 1px solid currentColor; }
    </style>
  </head>
  <body>
    <article class="paper">
      <header class="paper-header">
        <h1>材料题</h1>
      </header>
      <section class="module">
        <h2>资料分析</h2>
        <div class="material-question">
          <div class="material">
            <p>根据以下资料，回答下列问题。</p>
            <p><img src="assets/表1.png" alt=""></p>
          </div>
          <article class="question">
            <p class="stem"><span class="question-number">1.</span> 2024 年该市规模以上工业增加值增长了多少？</p>
            <ul class="options">
              <li><span class="option-letter">A.</span> 4.1%</li>
              <li><span class="option-letter">B.</span> 5.3%</li>
              <li><span class="option-letter">C.</span> 6.2%</li>
              <li><span class="option-letter">D.</span> 7.0%</li>
            </ul>
            <p class="answer">答案：C</p>
          </article>
          <article class="question">
            <p class="stem"><span class="question-number">2.</span> 与 2023 年相比，2024 年的增量约为多少亿元？</p>
            <ul class="options">
              <li><span class="option-letter">A.</span> <span class="math">1.2</span></li>
              <li><span class="option-letter">B.</span> <span class="math">2.4</span></li>
              <li><span class="option-letter">C.</span> <span class="math">3.6</span></li>
              <li><span class="option-letter">D.</span> <span class="math">4.8</span></li>
            </ul>
            <p class="answer">答案：B</p>
            <div class="explanation">
              <p><span class="label">解析：</span>由表可知。</p>
            </div>
          </article>
        </div>
      </section>
    </article>
  </body>
</html>
