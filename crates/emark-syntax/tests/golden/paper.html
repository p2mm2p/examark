<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2025 年国考行测模拟卷（一）</title>
    <style>
      body { margin: 0 auto; max-width: 40rem; padding: 2rem 1rem; font-family: system-ui, sans-serif; line-height: 1.8; color: #222; }
      h1 { font-size: 1.4rem; }
      h2 { font-size: 1.15rem; margin-top: 2.5rem; }
      h3 { font-size: 1rem; color: #666; }
      .paper-meta { color: #666; font-size: .9rem; }
      .question { margin: 1.5rem 0; }
      .options { list-style: none; padding: 0; }
      .options li { margin: .25rem 0; }
      .answer { font-weight: 600; }
      .explanation { color: #444; }
      .material { margin: 1.5rem 0 0; }
      .blank { display: inline-block; width: 4em; height: 1em; border-bottom: 1px solid currentColor; }
    </style>
  </head>
  <body>
    <article class="paper">
      <header class="paper-header">
        <h1>2025 年国考行测模拟卷（一）</h1>
        <p class="paper-meta">国家公务员录用考试 · 2025 · 副省级 · 网络整理</p>
      </header>
      <section class="module">
        <h2>言语理解与表达</h2>
        <h3 class="sub-category">逻辑填空</h3>
        <article class="question">
          <p class="stem"><span class="question-number">1.</span> 填入划横线部分最恰当的一项是：<br>他山之石，可以攻玉。两者差异。</p>
          <ul class="options">
            <li><span class="option-letter">A.</span> 截然不同</li>
            <li><span class="option-letter">B.</span> 大相径庭</li>
            <li><span class="option-letter">C.</span> 迥然不同</li>
            <li><span class="option-letter">D.</span> 天壤之别</li>
          </ul>
          <p class="answer">答案：B</p>
          <div class="explanation">
            <p><span class="label">解析：</span>上下文强调差距悬殊，故选 B。</p>
          </div>
        </article>
      </section>
      <section class="module">
        <h2>数量关系</h2>
        <article class="question">
          <p class="stem"><span class="question-number">2.</span> 某单位有 5 &lt; 8 名职工 &amp; 2 名实习生。</p>
          <p class="stem">现从中选出 3 人，问有多少种选法？</p>
          <ul class="options">
            <li><span class="option-letter">A.</span> 甲 &amp; 乙</li>
            <li><span class="option-letter">B.</span> 丙 &lt; 丁</li>
            <li><span class="option-letter">C.</span> 戊</li>
            <li><span class="option-letter">D.</span> 己</li>
          </ul>
          <p class="answer">答案：D</p>
        </article>
      </section>
    </article>
  </body>
</html>
